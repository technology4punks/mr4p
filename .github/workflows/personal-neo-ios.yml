name: My Personal Neo iOS
on:
  push:
    branches: [codex/my-personal-neo]
    paths: ['ios/**', '!ios/**/*.md', 'scripts/native/**', '.github/workflows/personal-neo-ios.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**', '!ios/**/*.md', 'scripts/native/**', '.github/workflows/personal-neo-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select available iPhone simulator
        shell: bash
        run: |
          xcodebuild -version
          xcrun simctl list devices available -j > /tmp/neo-simulators.json
          NEO_SIMULATOR_ID=$(python3 -c 'import json; d=json.load(open("/tmp/neo-simulators.json")); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "NEO_SIMULATOR_ID=$NEO_SIMULATOR_ID" >> "$GITHUB_ENV"
          # Boot concurrently with compilation; xcodebuild still verifies launch/test success.
          xcrun simctl boot "$NEO_SIMULATOR_ID" || true
      - name: Compile native app and tests
        run: xcodebuild build-for-testing -project ios/MyPersonalNeo.xcodeproj -scheme MyPersonalNeo -destination "platform=iOS Simulator,id=$NEO_SIMULATOR_ID" -derivedDataPath /tmp/NeoDerived ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - name: Compile optimized iPhone app without signing
        run: xcodebuild build -project ios/MyPersonalNeo.xcodeproj -scheme MyPersonalNeo -configuration Release -destination 'generic/platform=iOS' -derivedDataPath /tmp/NeoDevice CODE_SIGNING_ALLOWED=NO
      - name: Test core and actual USD Skel import
        timeout-minutes: 10
        run: xcodebuild test-without-building -project ios/MyPersonalNeo.xcodeproj -scheme MyPersonalNeo -destination "platform=iOS Simulator,id=$NEO_SIMULATOR_ID" -derivedDataPath /tmp/NeoDerived -parallel-testing-enabled NO -resultBundlePath /tmp/NeoTests.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-neo-ios-test-results
          path: /tmp/NeoTests.xcresult
          if-no-files-found: ignore
